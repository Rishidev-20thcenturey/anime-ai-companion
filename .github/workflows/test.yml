name: RAY-IMAGE tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Pre-download LPIPS weights
        run: |
          python -c "import lpips; lpips.LPIPS(net='vgg'); print('LPIPS weights downloaded successfully.')"
      - name: Run architecture smoke test
        run: python -m ray_image.train_smoke
      - name: Run N1 probe smoke test
        run: python -m ray_image.probe_smoke
      - name: Run N2 whitening smoke test
        run: python -m ray_image.whiten_smoke
      - name: Run N3 text-conditioning probe smoke test
        run: python -m ray_image.probe_text_smoke
      - name: Run N4 separability probe smoke test
        run: python -m ray_image.n4_smoke
      - name: Run N5 gated cross-attention smoke test
        run: python -m ray_image.n5_smoke
